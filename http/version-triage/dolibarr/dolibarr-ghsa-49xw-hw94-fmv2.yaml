id: dolibarr-ghsa-49xw-hw94-fmv2

info:
  name: Dolibarr <=21.0.2 - Remote Code Execution (Filter Bypass) [version-based]
  author: y0no
  severity: high
  description: |
    Version-based detection (unauthenticated fingerprint of the login page).
    Flags instances in range for the RCE filter-bypass advisory. Exploitation is
    AUTHENTICATED. Version exposure only. UNPATCHED at time of writing
    (present through 21.0.2).
  reference:
    - https://github.com/advisories/GHSA-49xw-hw94-fmv2
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 8.8
    cwe-id: CWE-94
  metadata:
    max-request: 2
    verified: true
  tags: dolibarr,ghsa,rce,code-injection,version

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.php"
    stop-at-first-match: true

    extractors:
      - type: regex
        name: dolversion
        internal: true
        part: body
        group: 1
        regex:
          - 'login_table_title center" title="Dolibarr ([0-9]+\.[0-9]+\.[0-9]+)"'
          - '(?:amp;|[?&])version=([0-9]+\.[0-9]+\.[0-9]+)'
          - 'Dolibarr ([0-9]+\.[0-9]+\.[0-9]+)'
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'login_table_title center" title="Dolibarr ([0-9]+\.[0-9]+\.[0-9]+)"'
          - '(?:amp;|[?&])version=([0-9]+\.[0-9]+\.[0-9]+)'
          - 'Dolibarr ([0-9]+\.[0-9]+\.[0-9]+)'

    matchers:
      - type: dsl
        dsl:
          - 'compare_versions(dolversion, "<= 21.0.2")'
